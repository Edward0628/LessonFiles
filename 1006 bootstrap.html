<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap切版</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/mycss01.css">
    <style>
        .box01 {
            height: 160px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="display-1 fw-900 text-center">Bootstrap排版</div>
        <div class="mytitle02 text-start fw-900 mt-3">1. 基本排版 col-1~12</div>
        <div class="row mt-3">
            <div class="col-6">
                <div class="box01 bg-success"></div>
            </div>
            <div class="col-6">
                <div class="box01 bg-success"></div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-4">
                <div class="box01 bg-danger"></div>
            </div>
            <div class="col-4">
                <div class="box01 bg-danger"></div>
            </div>
            <div class="col-4">
                <div class="box01 bg-danger"></div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-2">
                <div class="box01 bg-dark"></div>
            </div>
            <div class="col-8">
                <div class="box01 bg-dark"></div>
            </div>
            <div class="col-2">
                <div class="box01 bg-dark"></div>
            </div>
        </div>
        <div class="row mt-3">
            <!-- .col-4.mt-3*6>.box01.bg-secondary -->
            <div class="col-4 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-4 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-4 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-4 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-4 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-4 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
        </div>
        <div class="row mt-3">
            <!-- .col-1.mt3*12>.box01.bg-info -->
            <div class="col-1 mt3">
                <div class="box01 bg-info"></div>
            </div>
            <div class="col-1 mt3">
                <div class="box01 bg-info"></div>
            </div>
            <div class="col-1 mt3">
                <div class="box01 bg-info"></div>
            </div>
            <div class="col-1 mt3">
                <div class="box01 bg-info"></div>
            </div>
            <div class="col-1 mt3">
                <div class="box01 bg-info"></div>
            </div>
            <div class="col-1 mt3">
                <div class="box01 bg-info"></div>
            </div>
            <div class="col-1 mt3">
                <div class="box01 bg-info"></div>
            </div>
            <div class="col-1 mt3">
                <div class="box01 bg-info"></div>
            </div>
            <div class="col-1 mt3">
                <div class="box01 bg-info"></div>
            </div>
            <div class="col-1 mt3">
                <div class="box01 bg-info"></div>
            </div>
            <div class="col-1 mt3">
                <div class="box01 bg-info"></div>
            </div>
            <div class="col-1 mt3">
                <div class="box01 bg-info"></div>
            </div>
        </div>
        <div class="mytitle02 text-start fw-900 mt-3">2. RWD排版(sm,md,lg,xl,xxl)</div>
        <div class="row">
            <!-- 螢幕尺寸小於sm(576)換行 -->
            <div class="col-sm-6 mt-3">
                <div class="box01 bg-warning"></div>
            </div>
            <div class="col-sm-6 mt-3">
                <div class="box01 bg-warning"></div>
            </div>
        </div>
        <div class="row">
            <!-- 螢幕尺寸小於md(768)換行 -->
            <div class="col-md-6 mt-3">
                <div class="box01 bg-warning"></div>
            </div>
            <div class="col-md-6 mt-3">
                <div class="box01 bg-warning"></div>
            </div>
        </div>
        <div class="row">
            <!-- 螢幕尺寸小於lg(992)換行 -->
            <div class="col-lg-6 mt-3">
                <div class="box01 bg-warning"></div>
            </div>
            <div class="col-lg-6 mt-3">
                <div class="box01 bg-warning"></div>
            </div>
        </div>
        <!-- .row>.col-sm-6.col-md-4.col-lg-3.col-xl-2.col-xxl-1.mt-3*12>.box01.bg-secondary -->
        <div class="row">
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 mt-3">
                <div class="box01 bg-secondary"></div>
            </div>
        </div>
        <div class="mytitle02 text-start fw-900 mt-3">3. 顯示d-block,隱藏d-none</div>
        <!-- small-large隱藏格子 -->
        <div class="row">
            <div class="col-3 d-sm-none d-lg-block">
                <div class="box01 bg-secondary">
                    <div class="display-1">01</div>
                </div>
            </div>
            <div class="col-3 d-sm-none d-lg-block">
                <div class="box01 bg-secondary">
                    <div class="display-1">02</div>
                </div>
            </div>
            <div class="col-3 d-sm-none d-lg-block">
                <div class="box01 bg-secondary">
                    <div class="display-1">03</div>
                </div>
            </div>
            <div class="col-3 d-sm-none d-lg-block">
                <div class="box01 bg-secondary">
                    <div class="display-1">04</div>
                </div>
            </div>
        </div>
        <div class="mytitle02 text-start fw-900 mt-3">4. 推移(offset)</div>
        <!-- extra large 推移6格 -->
        <div class="row mt-3">
            <div class="col-6 offset-xl-6">
                <div class="box01 bg-secondary"></div>
            </div>
        </div>
        <!-- large推移4格 xxl推移8格 -->
        <div class="row mt-3">
            <div class="col-4 offset-lg-4 offset-xxl-8">
                <div class="box01 bg-secondary"></div>
            </div>
        </div>
        <!-- 階梯 螢幕小於lg:灰方塊填滿並隱藏綠色 螢幕大於lg:灰方塊呈現階梯並顯示綠色 -->
        <div class="row">
            <div class="col-lg-3 mt-3">
                <div class="box01 bg-dark"></div>
            </div>
            <div class="col-lg-3 mt-3 d-sm-none d-lg-block">
                <div class="box01 bg-success"></div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-3 offset-lg-3">
                <div class="box01 bg-secondary"></div>
            </div>
            <div class="col-lg-3 mt-3 d-sm-none d-lg-block">
                <div class="box01 bg-success"></div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-3 offset-lg-6">
                <div class="box01 bg-dark"></div>
            </div>
            <div class="col-lg-3 mt-3 d-sm-none d-lg-block">
                <div class="box01 bg-success"></div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-3 offset-lg-9">
                <div class="box01 bg-secondary"></div>
            </div>
        </div>
        <div class="mytitle02 text-start fw-900 mt-3">5. gutter間距(g-0~5, gx-0~5 gy-0~5)</div>
        <!-- md~lg啟用gutter1 -->
        <div class="row g-md-1 g-lg-0">
            <div class="col-md-4">
                <div class="box01 bg-success"></div>
            </div>
            <div class="col-md-4">
                <div class="box01 bg-success"></div>
            </div>
            <div class="col-md-4">
                <div class="box01 bg-success"></div>
            </div>
            <div class="col-md-4">
                <div class="box01 bg-success"></div>
            </div>
            <div class="col-md-4">
                <div class="box01 bg-success"></div>
            </div>
            <div class="col-md-4">
                <div class="box01 bg-success"></div>
            </div>
        </div>
        <!-- 選單+表格 -->
        <div class="row mt-3">
            <div class="col-2">
                <div class="box01 bg-secondary" style="height: 500px;">
                </div>
            </div>
            <div class="col-10">
                <div class="row g-1">
                    <div class="col-3">
                        <div class="box01 bg-dark"></div>
                    </div>
                    <div class="col-3">
                        <div class="box01 bg-dark"></div>
                    </div>
                    <div class="col-3">
                        <div class="box01 bg-dark"></div>
                    </div>
                    <div class="col-3">
                        <div class="box01 bg-dark"></div>
                    </div>
                    <div class="col-3">
                        <div class="box01 bg-dark"></div>
                    </div>
                    <div class="col-3">
                        <div class="box01 bg-dark"></div>
                    </div>
                    <div class="col-3">
                        <div class="box01 bg-dark"></div>
                    </div>
                    <div class="col-3">

                    </div>
                    <div class="col-3">

                    </div>
                    <div class="col-3">

                    </div>
                    <div class="col-3">
                        <div class="box01 bg-dark"></div>
                    </div>
                    <div class="col-3">
                        <div class="box01 bg-dark"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="mytitle02 text-start fw-900 mt-3">6. row-cols-中斷點-欄數</div>
        <div class="row g-2 row-cols-2 row-cols-md-5 row-cols-xl-6">
            <div class="col">
                <div class="box01 bg-success"></div>
            </div>
            <div class="col">
                <div class="box01 bg-success"></div>
            </div>
            <div class="col">
                <div class="box01 bg-success"></div>
            </div>
            <div class="col">
                <div class="box01 bg-success"></div>
            </div>
            <div class="col">
                <div class="box01 bg-success"></div>
            </div>
            <div class="col">
                <div class="box01 bg-success"></div>
            </div>
            <div class="col">
                <div class="box01 bg-success"></div>
            </div>
            <div class="col">
                <div class="box01 bg-success"></div>
            </div>
        </div>

    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>

        // for迴圈
        // i++ i=i+1
        for (i = 1; i < 11; i++) {
            console.log(i + ": SUP HOMIE!");
        }

        // 二維迴圈
        for (i = 1; i < 11; i++) {
            for (j = 1; j < 11; j++) {
                console.log(i + " x " + j + " = " + i * j);
            }
        }

        // 堆疊迴圈
        for (i = 0; i < 5; i++) {
            $("#demo09").append('<p class="mytitle01">This Is Sempiternal!!</p>');
        }

        // 圖片
        for (i = 0; i < 10; i++) {

        const cars = [

        console.log(cars);
        console.log(cars[0]);
        console.log(cars[1]);
        console.log(cars[2]);

        // 題目: 使用for迴圈將陣列內容cars印出來
        for (i = 0; i < 20; i++) {
            console.log(cars[i]);
        }

        // 使用length讀取未知數量之陣列
        for (i = 0; i < cars.length; i++) {
            console.log(cars[i]);
        }

        // 使用forEach讀取陣列 item為項目 index為索引
        cars.forEach(function (index, item) {
            console.log(index);
            console.log(item);
        });

        cars.forEach(function (item, index) {

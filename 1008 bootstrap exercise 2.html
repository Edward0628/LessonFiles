    <script>
        $(function () {
            // 介接資料
            $.ajax({
                type: "GET",
                url: "http://localhost:3000/travelfood",
                dataType: "json",
                success: showdata,
                error: function () {
                    console.log("介接失敗");
                    alert("介接失敗");
                }
            });
        });
        function showdata(data) {
            console.log(data);
            $("travelfood-list").empty();
            data.forEach(function (item) {
                const strHTML = `<div class="col-12 col-lg-6 col-xl-4">
                            <div class="box03 mt-3">
                                <img src="images/img02.avif" class="img-fluid" alt="">
                                <div class="h4 fw-900 text-center mt-3">${item.Name}</div>
                                <div class="h4">地址:${item.City}${item.Town}${item.Address}</div>
                                <div class="h4">電話:${item.Tel}</div>
                                <div class="h4">簡介:${item.HostWords}</div>
                            </div>
                        </div>`;
                        $("#travelfood-list").append(strHTML);
            });
        }

    </script>
